version: '3.9'

services:
  # ── MySQL ──────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: careerquest_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: careerquest
      MYSQL_USER: careerquest
      MYSQL_PASSWORD: careerquest_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ucareerquest", "-pcareerquest_pass"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Express API ────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: careerquest_api
    restart: unless-stopped
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: careerquest
      DB_PASSWORD: careerquest_pass
      DB_NAME: careerquest
      JWT_SECRET: careerquest_docker_jwt_secret_change_me
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  # ── React Frontend ─────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: careerquest_ui
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db_data:
